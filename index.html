<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Launcher">
<meta name="theme-color" content="#1c8f86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<title>Launcher</title>
</head>
<body>
  <div class="screen">
    <div class="top">
      <button class="fab" id="gear" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
      <h1 id="quote"></h1>
      <div class="rule"></div>
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="art" id="art">
      <button class="ok" id="ok" type="button"></button>
      <span class="hint on" id="hint"></span>
    </div>
    <div class="dock grid" id="dock"></div>
  </div>

  <button class="fab" id="add" type="button" aria-label="Add app">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="done" id="done" type="button"></button>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <input id="q" placeholder="" autocomplete="off" inputmode="search" enterkeyhint="search">
    <div class="results" id="results"></div>
  </div>
  <div class="pop" id="menu">
    <button class="pill" id="modeGrid" type="button"></button>
    <button class="pill" id="modeList" type="button"></button>
    <button class="pill" id="rename" type="button"></button>
    <button class="pill" id="about" type="button"></button>
  </div>
  <div class="info" id="info">
    <h2 id="infoTitle"></h2>
    <p id="infoVersion"></p>
    <p><span id="infoAuthor"></span>: <a href="https://browse.shortcuty.app/user/Sentechtipsvn">Sentechtipsvn</a></p>
    <p id="infoBody"></p>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
  <script src="js/app.js"></script>
</body>
</html>
