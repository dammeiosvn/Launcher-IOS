<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Launcher">
<title>Quick Launcher</title>
<style>
  :root { --teal: #1c8f86; --ink: #2c3338; --muted: #8b949c; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  body { color: var(--ink); }
  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    padding-top: env(safe-area-inset-top);
  }
  .top { padding: 28px 26px 8px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .4px;
    line-height: 1.15;
    text-transform: uppercase;
  }
  .rule { width: 72px; height: 3px; background: var(--teal); border-radius: 2px; margin: 10px 0 8px; }
  .date { font-size: 11px; letter-spacing: 1.6px; color: var(--muted); font-weight: 600; }
  .clock {
    display: inline-block;
    margin-top: 16px;
    background: var(--teal);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .art {
    position: relative;
    height: 180px;
    margin-top: 6px;
    background: #d7ece9 center/cover no-repeat;
  }
  .art .hint {
    position: absolute;
    right: 12px;
    bottom: 12px;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,.35);
    padding: 4px 8px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .art .hint.on { opacity: 1; pointer-events: auto; }
  .dock {
    flex: 1;
    background: var(--teal);
    padding: 22px 22px calc(92px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    background: none;
    border: 0;
    text-align: left;
    font-size: 17px;
    font-weight: 500;
    width: 100%;
    padding: 0;
  }
  .app img, .bubble {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    flex: none;
  }
  .bubble { display: grid; place-items: center; color: var(--teal); font-size: 16px; }
  .add {
    position: fixed;
    left: 22px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 20;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 0;
    background: #3dcc6e;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
  }
  .add.hide { display: none; }
  .add svg { width: 26px; height: 26px; display: block; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 30; }
  .mask.on { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 31;
    background: #fff;
    border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .25s ease;
    max-height: 78%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sheet.on { transform: none; }
  .sheet input {
    width: 100%;
    border: 1px solid #e3e6ea;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
  }
  .results { overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .hit {
    display: flex;
    gap: 10px;
    align-items: center;
    border: 0;
    background: #f6f7f8;
    border-radius: 12px;
    padding: 8px;
    text-align: left;
  }
  .hit img { width: 40px; height: 40px; border-radius: 10px; background: #fff; }
  .hit b { display: block; font-size: 14px; }
  .hit span { font-size: 11px; color: #6b7280; word-break: break-all; }
  .empty, .label { color: #8b949c; font-size: 12px; padding: 4px 2px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="top">
      <h1>Make it simple<br>on Sunday</h1>
      <div class="rule"></div>
      <div class="date" id="date">DEC. 05</div>
      <div class="clock" id="clock">19:27</div>
    </div>
    <div class="art" id="art"><span class="hint on" id="hint">Chọn ảnh</span></div>
    <div class="dock" id="dock"></div>
  </div>

  <button class="add" id="add" type="button" aria-label="Thêm ứng dụng">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <input id="q" placeholder="Tìm ứng dụng" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <input id="file" type="file" accept="image/*" hidden>

<script>
const SHORTCUT = "Quick Launcher";
const ILLU = "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=60";
const KEY = "ql_apps";
const BG = "ql_bg";
const MAX = 8;
const JSON_URL = "System/SystemApp.json";

const dock = document.getElementById("dock");
const art = document.getElementById("art");
const hint = document.getElementById("hint");
const file = document.getElementById("file");
const mask = document.getElementById("mask");
const sheet = document.getElementById("sheet");
const q = document.getElementById("q");
const results = document.getElementById("results");
const addBtn = document.getElementById("add");
let catalog = [];
let hintT;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; }
}
function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

function shortName(name) {
  return String(name || "").split(/\s*[-–—:|•]\s*/)[0].trim() || name;
}
function iconUrl(path) {
  return String(path || "").replace(/\\/g, "/").split("/").map(encodeURIComponent).join("/");
}

function tick() {
  const d = new Date();
  const mon = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()];
  document.getElementById("date").textContent = mon + ". " + String(d.getDate()).padStart(2, "0");
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tick();
setInterval(tick, 10000);

function paintBg() {
  art.style.backgroundImage = "url(" + (localStorage.getItem(BG) || ILLU) + ")";
}
paintBg();

function showHint() {
  hint.classList.add("on");
  clearTimeout(hintT);
  hintT = setTimeout(function () { hint.classList.remove("on"); }, 3000);
}
showHint();
art.onclick = function () {
  if (!hint.classList.contains("on")) { showHint(); return; }
  file.click();
};
hint.onclick = function (e) { e.stopPropagation(); file.click(); };
file.onchange = function () {
  const f = file.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function () { localStorage.setItem(BG, r.result); paintBg(); };
  r.readAsDataURL(f);
};

function run(bundleId) {
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT)
    + "&input=text&text=" + encodeURIComponent(bundleId);
}

function render() {
  const list = load();
  dock.innerHTML = "";
  list.forEach(function (app, i) {
    const b = document.createElement("button");
    b.className = "app";
    b.type = "button";
    b.innerHTML = (app.icon
      ? '<img src="' + app.icon + '" alt="">'
      : '<span class="bubble">●</span>') + "<span>" + shortName(app.name) + "</span>";
    b.onclick = function () { run(app.bundleId); };
    var t;
    b.ontouchstart = function () { t = setTimeout(function () { remove(i); }, 600); };
    b.ontouchend = function () { clearTimeout(t); };
    b.oncontextmenu = function (e) { e.preventDefault(); remove(i); };
    dock.appendChild(b);
  });
  addBtn.classList.toggle("hide", list.length >= MAX);
}
function remove(i) {
  const list = load();
  if (!confirm("Xóa " + shortName(list[i].name) + "?")) return;
  list.splice(i, 1);
  save(list);
  render();
}
render();

function openSheet() {
  if (load().length >= MAX) return;
  mask.classList.add("on");
  sheet.classList.add("on");
  q.value = "";
  paintResults("");
  setTimeout(function () { q.focus(); }, 200);
}
function closeSheet() {
  mask.classList.remove("on");
  sheet.classList.remove("on");
}
addBtn.onclick = openSheet;
mask.onclick = closeSheet;

var timer;
q.oninput = function () {
  clearTimeout(timer);
  timer = setTimeout(function () { paintResults(q.value.trim()); searchStore(q.value.trim()); }, 250);
};

function paintResults(term) {
  results.innerHTML = "";
  const qn = term.toLowerCase();
  const hits = catalog.filter(function (a) {
    return !qn || a.name.toLowerCase().indexOf(qn) >= 0 || a.bundleId.toLowerCase().indexOf(qn) >= 0;
  }).slice(0, 30);
  if (!catalog.length) {
    results.innerHTML = '<div class="empty">Chưa đọc được System/SystemApp.json</div>';
    return;
  }
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Ứng dụng hệ thống";
  results.appendChild(label);
  if (!hits.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Không có trong danh sách offline";
    results.appendChild(empty);
    return;
  }
  hits.forEach(function (hit) {
    const b = document.createElement("button");
    b.className = "hit";
    b.type = "button";
    b.innerHTML = '<img src="' + hit.icon + '" alt=""><div><b>' + hit.name + "</b><span>" + hit.bundleId + "</span></div>";
    b.onclick = function () { addApp(hit); };
    results.appendChild(b);
  });
}

function searchStore(term) {
  if (term.length < 2) return;
  const cb = "ql_" + Date.now();
  const old = document.getElementById("qljsonp");
  if (old) old.remove();
  window[cb] = function (data) {
    delete window[cb];
    const node = document.getElementById("qljsonp");
    if (node) node.remove();
    const hits = (data.results || []).filter(function (x) { return x.bundleId; }).slice(0, 8);
    if (!hits.length) return;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "App Store";
    results.appendChild(label);
    hits.forEach(function (hit) {
      const b = document.createElement("button");
      b.className = "hit";
      b.type = "button";
      b.innerHTML = '<img src="' + (hit.artworkUrl100 || hit.artworkUrl60 || "") + '" alt="">'
        + "<div><b>" + shortName(hit.trackName) + "</b><span>" + hit.bundleId + "</span></div>";
      b.onclick = function () {
        addApp({
          name: shortName(hit.trackName),
          bundleId: hit.bundleId,
          icon: hit.artworkUrl100 || hit.artworkUrl60 || ""
        });
      };
      results.appendChild(b);
    });
  };
  const s = document.createElement("script");
  s.id = "qljsonp";
  s.src = "https://itunes.apple.com/search?term=" + encodeURIComponent(term)
    + "&entity=software&country=vn&limit=8&callback=" + cb;
  document.body.appendChild(s);
}

function addApp(hit) {
  if (load().length >= MAX) return;
  const list = load().filter(function (a) { return a.bundleId !== hit.bundleId; });
  list.push({ name: shortName(hit.name), bundleId: hit.bundleId, icon: hit.icon });
  save(list);
  render();
  closeSheet();
}

fetch(JSON_URL).then(function (r) { return r.json(); }).then(function (data) {
  catalog = Object.keys(data || {}).map(function (id) {
    const row = data[id] || {};
    return { bundleId: id, name: shortName(row.Name || row.name || id), icon: iconUrl(row.icon) };
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
}).catch(function () { catalog = []; });
</script>
</body>
</html>
